spring.application.name=produto
server.port=8080

# Configuracao CloudAMQP (RabbitMQ)
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672/fatec}

# Exchanges e Filas para o servico de Produto
app.rabbitmq.exchange=produto.exchange
app.rabbitmq.queue=produto.queue
app.rabbitmq.routingkey=produto.created

# ── Logging: silencia ruído, destaca apenas os logs da aplicação ──────────────
logging.level.root=WARN
logging.level.com.example.produto=INFO
logging.level.org.springframework.boot=INFO
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n
